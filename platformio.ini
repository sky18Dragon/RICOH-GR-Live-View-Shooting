; RICOH GR x M5Stack StickS3 Remote Viewfinder
; Target: M5Stack StickS3 (ESP32-S3-PICO-1-N8R8, 8MB Flash, 8MB PSRAM)

[platformio]
default_envs = m5stack-sticks3

[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/link_esp_new_jpeg.py
lib_ignore = esp_new_jpeg

monitor_speed = 115200
upload_speed = 921600

board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

; Pinned to the versions verified on hardware (GR III family / GR IV,
; 2026-10). Unpinned git/registry specs made every fresh install -- CI and each
; new env -- build against whatever was newest.
lib_deps =
    M5GFX=https://github.com/m5stack/M5GFX.git#0.2.25
    M5Unified=https://github.com/m5stack/M5Unified.git#0.2.18
    M5PM1=https://github.com/m5stack/M5PM1.git#1.0.7
    esp_new_jpeg=https://components.espressif.com/api/downloads/?object_type=component&object_id=f346478b-a1a6-4eed-b903-b8658e031d87
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@2.5.0

; BLE uses NimBLE-Arduino for stable reconnect after camera power cycles.

; ---- Single-model firmware ------------------------------------------------
; Each env compiles only one model's protocol code (detection rules of every
; known model always stay in, so other cameras are rejected rather than
; misidentified). Building them is the coupling check: a model that reached
; into another model's sources would fail to link here.

[env:sticks3-ricoh-gr3]
extends = env:m5stack-sticks3
build_flags =
    ${env:m5stack-sticks3.build_flags}
    -DRVF_RICOH_GR2=0
    -DRVF_RICOH_GR4=0
build_src_filter =
    +<*>
    -<brands/ricoh/gr2/>
    -<brands/ricoh/gr4/>
    +<brands/ricoh/gr4/Gr4Detection.cpp>

[env:sticks3-ricoh-gr4]
extends = env:m5stack-sticks3
build_flags =
    ${env:m5stack-sticks3.build_flags}
    -DRVF_RICOH_GR2=0
    -DRVF_RICOH_GR3=0
build_src_filter =
    +<*>
    -<brands/ricoh/gr2/>
    -<brands/ricoh/gr3/>
    +<brands/ricoh/gr3/Gr3Detection.cpp>

; ---- Host-side tests --------------------------------------------------------

[native_src]
common =
    -<*>
    +<ble_pairing_policy.cpp>
    +<ble_discovery_policy.cpp>
    +<ble_reconnect_policy.cpp>
    +<ble_scan_lifecycle_policy.cpp>
    +<camera_identity.cpp>
    +<camera/CameraRegistry.cpp>
    +<app/AppRuntime.cpp>
    +<camera_protocol_profile.cpp>
    +<liveview_reso_policy.cpp>
    +<brands/ricoh/common/RicohBleProtocolRouter.cpp>
    +<brands/ricoh/gr3/Gr3Detection.cpp>
    +<brands/ricoh/gr4/Gr4Detection.cpp>
    +<mjpeg_stream.cpp>
    +<brands/ricoh/flow/RicohFlowController.cpp>
    +<supervisor/SystemSupervisor.cpp>
    +<ui/ButtonInput.cpp>
    +<ui/OrientationTracker.cpp>
    +<ui/UiAnimator.cpp>
    +<ui/UiCoordinator.cpp>
    +<ui/NativeBuildMain.cpp>
gr2 =
    +<brands/ricoh/gr2/Gr2Profile.cpp>
    +<brands/ricoh/gr2/Gr2ProvisioningLogic.cpp>
    +<brands/ricoh/gr2/Gr2ShutterPolicy.cpp>
gr3 =
    +<brands/ricoh/gr3/Gr3Profile.cpp>
    +<brands/ricoh/gr3/Gr3BleProtocol.cpp>
gr4 =
    +<brands/ricoh/gr4/Gr4Profile.cpp>
    +<brands/ricoh/gr4/Gr4LegacyBleProtocol.cpp>
    +<brands/ricoh/gr4/Gr4WifiCredentialParser.cpp>

[env:native]
platform = native
test_build_src = yes
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DRVF_NATIVE_BUILD
build_src_filter =
    ${native_src.common}
    ${native_src.gr2}
    ${native_src.gr3}
    ${native_src.gr4}
test_filter = test_native_*

; The model-selection suite again, against single-model builds.
[env:native-gr3]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DRVF_RICOH_GR2=0
    -DRVF_RICOH_GR4=0
build_src_filter =
    ${native_src.common}
    ${native_src.gr3}
test_filter = test_native_model_selection

[env:native-gr4]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DRVF_RICOH_GR2=0
    -DRVF_RICOH_GR3=0
build_src_filter =
    ${native_src.common}
    ${native_src.gr4}
test_filter = test_native_model_selection
